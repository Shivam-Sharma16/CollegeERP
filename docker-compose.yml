services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://gateway:4000
    volumes:
      - ./apps/web:/app
      - /app/node_modules


  gateway:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=gateway
        - SERVICE_PORT=4000
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - USER_SERVICE_URL=http://user-service:4002
      - ACADEMIC_SERVICE_URL=http://academic-service:4003
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4004
      - RESULTS_SERVICE_URL=http://results-service:4005
      - FEES_SERVICE_URL=http://fees-service:4006
      - NOTICE_SERVICE_URL=http://notice-service:4007
      - NOTIFICATION_SERVICE_URL=http://notification-service:4008
      - AI_AGENT_SERVICE_URL=http://ai-agent-service:4009
      - INSTITUTION_SERVICE_URL=http://institution-service:4010
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=/^FdEq-yhAvZ|c!g*O9dF:!on:9qZ1*1+G&*5_(v@p=
    env_file:
      - ./services/gateway/.env
    depends_on:
      - mongo
      - redis

  auth-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=auth-service
        - SERVICE_PORT=4001
    ports:
      - "4001:4001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - mongo

  user-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=user-service
        - SERVICE_PORT=4002
    ports:
      - "4002:4002"
    env_file:
      - ./services/user-service/.env
    depends_on:
      - mongo

  academic-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=academic-service
        - SERVICE_PORT=4003
    ports:
      - "4003:4003"
    env_file:
      - ./services/academic-service/.env
    depends_on:
      - mongo

  attendance-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=attendance-service
        - SERVICE_PORT=4004
    ports:
      - "4004:4004"
    env_file:
      - ./services/attendance-service/.env
    depends_on:
      - mongo
      - redis
  results-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=results-service
        - SERVICE_PORT=4005
    ports:
      - "4005:4005"
    env_file:
      - ./services/results-service/.env
    depends_on:
      - mongo

  fees-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=fees-service
        - SERVICE_PORT=4006
    ports:
      - "4006:4006"
    env_file:
      - ./services/fees-service/.env
    depends_on:
      - mongo

  notice-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=notice-service
        - SERVICE_PORT=4007
    ports:
      - "4007:4007"
    env_file:
      - ./services/notice-service/.env
    depends_on:
      - mongo

  notification-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=notification-service
        - SERVICE_PORT=4008
    ports:
      - "4008:4008"
    env_file:
      - ./services/notification-service/.env
    depends_on:
      - mongo
      - redis
  ai-agent-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=ai-agent-service
        - SERVICE_PORT=4009
    ports:
      - "4009:4009"
    env_file:
      - ./services/ai-agent-service/.env
    depends_on:
      - mongo

  institution-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=institution-service
        - SERVICE_PORT=4010
    ports:
      - "4010:4010"
    env_file:
      - ./services/institution-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=/^FdEq-yhAvZ|c!g*O9dF:!on:9qZ1*1+G&*5_(v@p=
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
