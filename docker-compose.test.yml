services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=gateway
        - SERVICE_PORT=4000
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/college_erp_test
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4001
      - USER_SERVICE_URL=http://user-service:4002
      - ACADEMIC_SERVICE_URL=http://academic-service:4003
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4004
      - RESULTS_SERVICE_URL=http://results-service:4005
      - FEES_SERVICE_URL=http://fees-service:4006
      - NOTICE_SERVICE_URL=http://notice-service:4007
      - NOTIFICATION_SERVICE_URL=http://notification-service:4008
      - AI_AGENT_SERVICE_URL=http://ai-agent-service:4009
      - INSTITUTION_SERVICE_URL=http://institution-service:4010
      - INTERNAL_SERVICE_KEY=ci_test_internal_key
      - JWT_ACCESS_SECRET=ci_test_jwt_access_secret_12345
      - NODE_ENV=test
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      institution-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=auth-service
        - SERVICE_PORT=4001
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/college_erp_test
      - JWT_ACCESS_SECRET=ci_test_jwt_access_secret_12345
      - JWT_REFRESH_SECRET=ci_test_jwt_refresh_secret_12345
      - SUPERADMIN_SETUP_KEY=changeme123_secret_example
      - NODE_ENV=test
    depends_on:
      mongo:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: ./infra/docker/service.Dockerfile
      args:
        - SERVICE_NAME=user-service
        - SERVICE_PORT=4002
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGO_URI=mongodb://mongo:27017/college_erp_test
      - JWT_ACCESS_SECRET=ci_test_jwt_access_secret_12345
      - NODE_ENV=test
    depends_on:
      mongo:
        condition: service_healthy

  academic-service:
